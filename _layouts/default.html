<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  {%- feed_meta -%}
  {%- seo -%}
</head>
<body>
  <header class="masthead">
    <a class="masthead-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/writing/' | relative_url }}">Writing</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="colophon">
    <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    <span>&copy; {{ 'now' | date: "%Y" }} {{ site.author | default: site.title }}</span>
  </footer>
</body>
</html>
